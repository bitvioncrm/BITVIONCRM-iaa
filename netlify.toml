[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions.whatsapp-bulk]
  timeout = 26

[functions.whatsapp-send]
  timeout = 26

[functions.whatsapp-profile]
  timeout = 26

[functions.backup-daily]
  schedule = "30 20 * * *"
  timeout = 26

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
